<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>メモ帳 — approved refined mockup (synthetic fixture)</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  section { display: none; }
  [data-ui-state="STATE-LIST"] .list, [data-ui-state="STATE-EXPANDED"] .list,
  [data-ui-state="STATE-PRIVATE-MODE"] .list, [data-ui-state="STATE-PRIVATE-MODE"] .private,
  [data-ui-state="STATE-CONFIRM-DELETE"] .confirm, [data-ui-state="STATE-DELETED"] .deleted,
  [data-ui-state="STATE-SAVED"] .saved, [data-ui-state="STATE-STORAGE-ERROR"] .storage-error { display: block; }
  #MEMO-BODY { width: 280px; max-height: 1.4em; line-height: 1.4em; overflow: hidden; }
  [data-ui-state="STATE-EXPANDED"] #MEMO-BODY { max-height: none; }
</style>
<main data-ui-screen="SCREEN-NOTES" data-ui-state="STATE-LIST">
  <h1>メモ</h1>
  <section class="private">
    <p data-ui-id="PRIVATE-MODE-GUIDANCE" data-ui-important data-ui-exact-copy role="note">プライベートモードでは、メモはこのタブを閉じると消えます。残したいメモは通常モードで保存してください。</p>
  </section>
  <section class="list">
    <h2 data-ui-id="NOTE-TITLE-1" data-ui-important data-ui-exact-copy>買い物リスト</h2>
    <div id="MEMO-BODY" data-ui-id="MEMO-BODY" data-ui-important data-ui-require-truncation>牛乳、卵、食パン、トマト、玉ねぎ、鶏むね肉、ヨーグルト、コーヒー豆、洗剤、ティッシュペーパーを週末までに買う。</div>
    <button data-ui-id="EXPAND-MEMO" data-ui-important data-ui-exact-copy data-ui-action-id="EXPAND" data-ui-expected-state="STATE-EXPANDED" data-ui-action-target="MEMO-BODY">全文を表示</button>
    <button data-ui-id="SAVE-NOTE" data-ui-important data-ui-exact-copy data-ui-action-id="SAVE" data-ui-expected-state="STATE-SAVED">保存</button>
    <button data-ui-id="DELETE-NOTE" data-ui-important data-ui-exact-copy data-ui-action-id="DELETE" data-ui-expected-state="STATE-CONFIRM-DELETE">削除</button>
  </section>
  <section class="confirm" role="alertdialog" aria-labelledby="confirm-title" data-ui-id="DELETE-DIALOG" data-ui-region>
    <h2 id="confirm-title" data-ui-id="DELETE-CONFIRM-TITLE" data-ui-important data-ui-exact-copy>メモを削除しますか？</h2>
    <p data-ui-id="DELETE-CONFIRM-DETAIL" data-ui-important data-ui-exact-copy>「買い物リスト」（2026/10/01 更新）を削除します。この操作は取り消せません。</p>
    <button data-ui-id="CONFIRM-DELETE" data-ui-important data-ui-exact-copy data-ui-action-id="CONFIRM-DELETE" data-ui-expected-state="STATE-DELETED">削除する</button>
    <button data-ui-id="CANCEL-DELETE" data-ui-important data-ui-exact-copy data-ui-action-id="CANCEL-DELETE" data-ui-expected-state="STATE-LIST">キャンセル</button>
  </section>
  <section class="deleted">
    <p data-ui-id="DELETE-COMPLETE" data-ui-important data-ui-exact-copy role="status">メモを削除しました</p>
  </section>
  <section class="saved">
    <p data-ui-id="SAVE-COMPLETE" data-ui-important data-ui-exact-copy role="status">✓ 保存しました</p>
  </section>
  <section class="storage-error">
    <p data-ui-id="STORAGE-READ-ERROR" data-ui-important data-ui-exact-copy role="alert">保存データを読み込めませんでした。ブラウザのストレージ設定を確認してから、再読み込みしてください。</p>
    <button data-ui-id="RETRY-LOAD" data-ui-important data-ui-exact-copy>再読み込み</button>
  </section>
</main>
<script>
  const root = document.querySelector('[data-ui-screen]');
  const scenario = new URLSearchParams(location.search).get('scenario');
  if (scenario === 'storage-error') root.dataset.uiState = 'STATE-STORAGE-ERROR';
  if (scenario === 'private') root.dataset.uiState = 'STATE-PRIVATE-MODE';
  for (const button of document.querySelectorAll('[data-ui-action-id]')) {
    button.addEventListener('click', () => { root.dataset.uiState = button.dataset.uiExpectedState; });
  }
</script>
</html>
